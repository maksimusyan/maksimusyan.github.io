<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <title>Инструменты разработчика</title>
    <style>
      #pwd-list {
        width: 960px;
        height: 700px;
        min-width: 300px;
        min-height: 300px;
        font-size: 16px;
        letter-spacing: 2px;
        line-height: 22px;
        border: 1px solid #eaeaea;
      }
      .box {
        margin: 10px 0 10px 0;
      }
      #pwd-count {
        width: 100px;
        margin-right: 10px;
      }
      #pwd-length {
        width: 50px;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Пароли</h1>
    <div class="box">
      Кол-во: 
      <input id="pwd-count" type="number" min="1" max="100000" step="1" value="30" />
      Длина пароля: 
      <input id="pwd-length" type="number" min="3" max="64" step="1" value="24" />
      <button id="btn-reload">Генерировать</button>
    </div>
    <textarea id="pwd-list" spellcheck="false"></textarea>

    <script src="/scripts/random-generator.js"></script>
    <script>
      function updateList() {
        const pwdList = document.getElementById('pwd-list');
        const pwdCount = document.getElementById('pwd-count');
        const pwdLength = document.getElementById('pwd-length');
        
        const getCountVal = Number.parseInt(pwdCount.value);
        const getLengthVal = Number.parseInt(pwdLength.value);
  
        let countPasswords = Number.isInteger(getCountVal) && getCountVal > 0 ? getCountVal : 30;
        let lengthPassword = Number.isInteger(getLengthVal) && getLengthVal > 0 ? getLengthVal : 24;

        if (countPasswords > 100_000) {
          pwdCount.value = 100_000;
          countPasswords = 100_000;
          alert('Слишком много паролей, большая нагрузка на процессор. Сброшено до 100К');
        }

        if (lengthPassword < 3) lengthPassword = 3;

        let result = '';

        for (let i = 0; i <= countPasswords; i++) {
          const randomString = generateSecureRandomString({
            length: lengthPassword,
            avoidNarrowCharsOnEdges: true,
            firstCharAlphanumeric: true,
            lastCharAlphanumeric: true,
            excludeChars: '}{][],.:;!|'
          });
  
          result += `${randomString}\n`;
        }
          
        pwdList.value = result;
      }

      var btn = document.getElementById('btn-reload');
      btn.addEventListener('click', (e) => {
        updateList();
      });

      updateList();
    </script>
  </body>
</html>
