<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <title>Инструменты разработчика</title>
  </head>
  <body>
    <h1>Твой новый пароль</h1>
    <pre id="new-pwd"></pre>
    <script src="/scripts/random-generator.js"></script>
    <script>
      let result = '';

      for (let i = 0; i <= 10; i++) {
        const randomString = generateSecureRandomString({
          length: 16,
          avoidNarrowCharsOnEdges: true,
          firstCharAlphanumeric: true,
          lastCharAlphanumeric: true,
          excludeChars: '}{][],.:;!|'
        });

        result += `${randomString}\n`;
      }

      const targ = document.getElementById('new-pwd');
      targ.innerHTML = result;

    </script>
  </body>
</html>
