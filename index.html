<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <title>Инструменты разработчика</title>
    <style>
      #pwd-list {
        min-width: 300px;
        min-height: 800px;
        font-size: 16px;
        letter-spacing: 2px;
        line-height: 22px;
        border: 1px solid #eaeaea;
      }
      .box {
        margin: 10px 0 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Пароли</h1>
    <div class="box">
      <button id="btn-reload">Генерировать заново</button>
    </div>
    <textarea id="pwd-list" spellcheck="false"></textarea>

    <script src="/scripts/random-generator.js"></script>
    <script>
      var btn = document.getElementById('btn-reload');
      var list = document.getElementById('pwd-list');
      
      function updateList() {
        let result = '';
  
        for (let i = 0; i <= 30; i++) {
          const randomString = generateSecureRandomString({
            length: 24,
            avoidNarrowCharsOnEdges: true,
            firstCharAlphanumeric: true,
            lastCharAlphanumeric: true,
            excludeChars: '}{][],.:;!|'
          });
  
          result += `${randomString}\n`;
        }
          
        list.value = result;
      }

      btn.addEventListener('click', (e) => {
        updateList();
      });

      updateList();
    </script>
  </body>
</html>
